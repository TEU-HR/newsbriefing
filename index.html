<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>일간 뉴스 브리핑</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 850px; margin: 0 auto; padding: 20px; line-height: 1.6; background-color: #f8f9fa; color: #212529; }
    .header { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 2px solid #212529; padding-bottom: 10px; margin-bottom: 20px; }
    .header h1 { margin: 0; font-size: 1.8rem; }
    .header .date { font-size: 0.95rem; color: #6c757d; font-weight: 500; }
    .card { background: white; border-radius: 10px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .summary { white-space: pre-line; background-color: #f1f3f5; padding: 18px; border-radius: 8px; font-size: 0.98rem; }
    .category-title { font-size: 1.15rem; margin-top: 25px; margin-bottom: 10px; color: #1c7ed6; border-bottom: 1px solid #e9ecef; padding-bottom: 5px; }
    ul { padding-left: 20px; margin: 0; }
    li { margin-bottom: 8px; }
    a { color: #1b6ec2; text-decoration: none; font-weight: 500; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="header">
    <h1>📰 일간 AI 뉴스 브리핑</h1>
    <div id="updated-at" class="date">최근 업데이트: -</div>
  </div>
  
  <div class="card">
    <h2>🤖 AI 핵심 요약</h2>
    <div id="summary" class="summary">데이터를 불러오는 중...</div>
  </div>

  <div class="card">
    <h2>📑 분야별 주요 기사 목록</h2>
    <div id="categories-container"></div>
  </div>

  <script>
    fetch('./data.json')
      .then(response => response.json())
      .then(data => {
        document.getElementById('updated-at').innerText = '최근 업데이트: ' + (data.updated_at || '알 수 없음');
        document.getElementById('summary').innerText = data.summary;
        
        const container = document.getElementById('categories-container');
        container.innerHTML = '';

        if (data.categories) {
          for (const [category, articles] of Object.entries(data.categories)) {
            const catTitle = document.createElement('h3');
            catTitle.className = 'category-title';
            catTitle.innerText = `■ ${category}`;
            container.appendChild(catTitle);

            const ul = document.createElement('ul');
            articles.forEach(article => {
              const li = document.createElement('li');
              li.innerHTML = `<a href="${article.link}" target="_blank">${article.title}</a>`;
              ul.appendChild(li);
            });
            container.appendChild(ul);
          }
        }
      })
      .catch(err => {
        document.getElementById('summary').innerText = '데이터를 불러오지 못했습니다.';
        console.error(err);
      });
  </script>
</body>
</html>
