<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>일간 AI 뉴스 브리핑</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 850px; margin: 0 auto; padding: 20px; line-height: 1.6; background-color: #f8f9fa; color: #212529; }
    .header { border-bottom: 2px solid #212529; padding-bottom: 15px; margin-bottom: 20px; }
    .header-top { display: flex; justify-content: space-between; align-items: center; }
    .header h1 { margin: 0; font-size: 1.8rem; }
    .btn-refresh { background-color: #2b8a3e; color: white; padding: 8px 14px; text-decoration: none; border-radius: 6px; font-size: 0.85rem; font-weight: bold; }
    .btn-refresh:hover { background-color: #2b7036; }
    
    .tab-container { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab-btn { flex: 1; padding: 12px; font-size: 1rem; font-weight: bold; border: 1px solid #dee2e6; background-color: #e9ecef; border-radius: 8px; cursor: pointer; text-align: center; color: #495057; }
    .tab-btn.active { background-color: #1c7ed6; color: white; border-color: #1c7ed6; }
    
    .date { font-size: 0.9rem; color: #6c757d; margin-top: 8px; font-weight: bold; }
    .card { background: white; border-radius: 10px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .summary { white-space: pre-line; background-color: #f1f3f5; padding: 18px; border-radius: 8px; font-size: 0.98rem; }
    .category-title { font-size: 1.15rem; margin-top: 25px; margin-bottom: 10px; color: #1c7ed6; border-bottom: 1px solid #e9ecef; padding-bottom: 5px; }
    ul { padding-left: 20px; margin: 0; }
    li { margin-bottom: 8px; }
    a { color: #1b6ec2; text-decoration: none; font-weight: 500; }
    a:hover { text-decoration: underline; }
    .badge { font-size: 0.75rem; background: #e9ecef; color: #495057; padding: 2px 6px; border-radius: 4px; margin-left: 6px; font-weight: bold; }
    .pub-time { font-size: 0.78rem; color: #868e96; margin-left: 6px; font-weight: normal; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-top">
      <h1>📰 AI 뉴스 브리핑</h1>
      <a href="https://github.com/teu-hr/newsbriefing/actions" target="_blank" class="btn-refresh">⚡ 실시간 뉴스 즉시 수집</a>
    </div>
  </div>

  <div class="tab-container">
    <button id="tab-morning" class="tab-btn active" onclick="switchTrack('morning')">🌅 아침 정기 브리핑 (08:00)</button>
    <button id="tab-realtime" class="tab-btn" onclick="switchTrack('realtime')">⚡ 실시간 수집 브리핑</button>
  </div>

  <div id="updated-at" class="date">최근 업데이트: -</div>

  <div class="card">
    <h2>🤖 AI 핵심 요약</h2>
    <div id="summary" class="summary">데이터를 불러오는 중...</div>
  </div>

  <div class="card">
    <h2>📑 분야별 주요 기사 목록</h2>
    <div id="categories-container"></div>
  </div>

  <script>
    let globalData = {};
    let currentTrack = 'morning';

    fetch('./data.json')
      .then(response => response.json())
      .then(data => {
        globalData = data;
        if (!globalData.morning && globalData.realtime) {
          currentTrack = 'realtime';
        }
        renderTrack(currentTrack);
      })
      .catch(err => {
        document.getElementById('summary').innerText = '데이터를 불러오지 못했습니다. 뉴스 즉시 수집하기 버튼을 눌러주세요.';
        console.error(err);
      });

    function switchTrack(track) {
      currentTrack = track;
      document.getElementById('tab-morning').classList.toggle('active', track === 'morning');
      document.getElementById('tab-realtime').classList.toggle('active', track === 'realtime');
      renderTrack(track);
    }

    function renderTrack(track) {
      const trackData = globalData[track];
      const container = document.getElementById('categories-container');
      
      if (!trackData) {
        document.getElementById('updated-at').innerText = '최근 업데이트: 정보 없음';
        document.getElementById('summary').innerText = '해당 트랙의 수집된 데이터가 없습니다.';
        container.innerHTML = '';
        return;
      }

      document.getElementById('updated-at').innerText = '최근 업데이트: ' + (trackData.updated_at || '알 수 없음');
      document.getElementById('summary').innerText = trackData.summary;
      
      container.innerHTML = '';
      if (trackData.categories) {
        for (const [category, articles] of Object.entries(trackData.categories)) {
          const catTitle = document.createElement('h3');
          catTitle.className = 'category-title';
          catTitle.innerText = `■ ${category}`;
          container.appendChild(catTitle);

          const ul = document.createElement('ul');
          articles.forEach(article => {
            const li = document.createElement('li');
            const timeTag = article.pub_time ? `<span class="pub-time">🕒 ${article.pub_time}</span>` : '';
            li.innerHTML = `<a href="${article.link}" target="_blank">${article.title}</a> <span class="badge">${article.source}</span> ${timeTag}`;
            ul.appendChild(li);
          });
          container.appendChild(ul);
        }
      }
    }
  </script>
</body>
</html>
