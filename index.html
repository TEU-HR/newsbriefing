<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>팀 뉴스 브리핑</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 850px; margin: 0 auto; padding: 20px; line-height: 1.6; background-color: #f8f9fa; color: #212529; }
    .header { border-bottom: 2px solid #212529; padding-bottom: 15px; margin-bottom: 20px; }
    .header-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    .header h1 { margin: 0; font-size: 1.8rem; }
    .btn-refresh { background-color: #2b8a3e; color: white; padding: 8px 14px; text-decoration: none; border-radius: 6px; font-size: 0.85rem; font-weight: bold; }
    .btn-refresh:hover { background-color: #2b7036; }
    
    .toolbar { display: flex; justify-content: space-between; align-items: center; background: white; padding: 12px 18px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.05); flex-wrap: wrap; gap: 10px; }
    .date-picker-group { display: flex; align-items: center; gap: 8px; font-weight: bold; font-size: 0.95rem; }
    input[type="date"] { padding: 6px 10px; border: 1px solid #ced4da; border-radius: 6px; font-size: 0.9rem; font-weight: bold; cursor: pointer; }
    
    .date { font-size: 0.88rem; color: #6c757d; font-weight: bold; }
    .card { background: white; border-radius: 10px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .summary { white-space: pre-line; background-color: #f1f3f5; padding: 18px; border-radius: 8px; font-size: 0.98rem; }
    .category-title { font-size: 1.15rem; margin-top: 25px; margin-bottom: 10px; color: #1c7ed6; border-bottom: 1px solid #e9ecef; padding-bottom: 5px; }
    ul { padding-left: 20px; margin: 0; }
    li { margin-bottom: 8px; }
    a { color: #1b6ec2; text-decoration: none; font-weight: 500; }
    a:hover { text-decoration: underline; }
    .badge { font-size: 0.75rem; background: #e9ecef; color: #495057; padding: 2px 6px; border-radius: 4px; margin-left: 6px; font-weight: bold; }
    .pub-time { font-size: 0.78rem; color: #868e96; margin-left: 6px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-top">
      <h1>📰 임직원 AI 뉴스 브리핑</h1>
      <a href="https://github.com/teu-hr/newsbriefing/actions" target="_blank" class="btn-refresh">⚡ 즉시 수집 실행</a>
    </div>
  </div>

  <div class="toolbar">
    <div class="date-picker-group">
      <span>📅 브리핑 날짜 선택:</span>
      <input type="date" id="date-picker" onchange="loadHistoricalData(this.value)">
    </div>
    <div id="updated-at" class="date">업데이트: -</div>
  </div>

  <div class="card">
    <h2>🤖 AI 핵심 요약</h2>
    <div id="summary" class="summary">데이터를 불러오는 중...</div>
  </div>

  <div class="card">
    <h2>📑 분야별 주요 기사 목록</h2>
    <div id="categories-container"></div>
  </div>

  <script>
    let availableDates = [];

    // 페이지 진입 시 인덱스 및 오늘 데이터 로드
    fetch('./history/index.json')
      .then(res => res.json())
      .then(dates => {
        availableDates = dates;
        const picker = document.getElementById('date-picker');
        if (dates.length > 0) {
          picker.min = dates[dates.length - 1];
          picker.max = dates[0];
          picker.value = dates[0]; // 최신 날짜 기본 선택
          loadHistoricalData(dates[0]);
        } else {
          loadLatestData();
        }
      })
      .catch(() => {
        loadLatestData();
      });

    function loadLatestData() {
      fetch('./data.json')
        .then(res => res.json())
        .then(data => {
          const payload = data.morning || data.realtime;
          if (payload) {
            renderPayload(payload);
            if (payload.date) {
              document.getElementById('date-picker').value = payload.date;
            }
          }
        })
        .catch(err => {
          document.getElementById('summary').innerText = '데이터를 불러올 수 없습니다.';
        });
    }

    function loadHistoricalData(dateStr) {
      fetch(`./history/${dateStr}.json`)
        .then(res => {
          if (!res.ok) throw new Error("File not found");
          return res.json();
        })
        .then(data => {
          renderPayload(data);
        })
        .catch(() => {
          document.getElementById('summary').innerText = `${dateStr} 자로 수집된 아침 브리핑 기록이 없습니다.`;
          document.getElementById('categories-container').innerHTML = '';
          document.getElementById('updated-at').innerText = '데이터 없음';
        });
    }

    function renderPayload(payload) {
      document.getElementById('updated-at').innerText = '수집 시각: ' + (payload.updated_at || '-');
      document.getElementById('summary').innerText = payload.summary || '요약 내용이 없습니다.';

      const container = document.getElementById('categories-container');
      container.innerHTML = '';

      if (payload.categories) {
        for (const [category, articles] of Object.entries(payload.categories)) {
          const catTitle = document.createElement('h3');
          catTitle.className = 'category-title';
          catTitle.innerText = `■ ${category}`;
          container.appendChild(catTitle);

          const ul = document.createElement('ul');
          articles.forEach(article => {
            const li = document.createElement('li');
            const timeTag = article.pub_time ? `<span class="pub-time">🕒 ${article.pub_time}</span>` : '';
            li.innerHTML = `<a href="${article.link}" target="_blank">${article.title}</a> <span class="badge">${article.source}</span> ${timeTag}`;
            ul.appendChild(li);
          });
          container.appendChild(ul);
        }
      }
    }
  </script>
</body>
</html>
