<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>뉴스톺아보기</title>
    <meta name="description" content="동아일보·조선일보·중앙일보 등 주요 언론사 뉴스를 AI가 조간·석간·사설 비교로 매일 요약하는 뉴스 브리핑">
    <meta property="og:title" content="뉴스톺아보기">
    <meta property="og:description" content="주요 언론사 뉴스를 AI가 조간·석간·사설 비교로 매일 요약합니다.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://teu-hr.github.io/newsbriefing/assets/logo/og-image.png">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:image" content="https://teu-hr.github.io/newsbriefing/assets/logo/og-image.png">
    <link rel="icon" type="image/png" href="assets/logo/favicon-32.png">
    <link rel="apple-touch-icon" href="assets/logo/apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#101c2b">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap">
    <style>
        @font-face {
            font-family: 'HangyeolBody';
            src: url('assets/fonts/HangyeolBody.woff2') format('woff2');
            font-weight: 400;
            font-display: swap;
        }

        :root {
            --paper: #f7f4ee;
            --ink: #172230;
            --ink-soft: #6c7480;
            --line: #e2ddd0;
            --masthead: #101c2b;
            --masthead-ink: #f3ede0;
            --accent: #1f7a68;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --paper: #13181f;
                --ink: #eef1f5;
                --ink-soft: #8b93a0;
                --line: #2a3340;
                --accent: #35a98c;
            }

            /* 언론사 CI가 대부분 어두운 색이라 어두운 배경에서 잘 안 보여서,
               다크모드에서만 밝은 판을 깔아 대비를 만든다. */
            .top3-logo {
                background: #f3ede0;
                padding: 2px 5px;
                border-radius: 2px;
            }
        }

        html { color-scheme: light dark; }
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--paper);
            color: var(--ink);
            line-height: 1.6;
        }

        a { color: var(--accent); }

        .nb-hscroll { scrollbar-width: none; -ms-overflow-style: none; }
        .nb-hscroll::-webkit-scrollbar { display: none; }

        /* ===== 마스트헤드 ===== */
        .nb-masthead {
            position: sticky;
            top: 0;
            z-index: 10;
            background: var(--masthead);
            border-bottom: 4px double #08101a;
        }

        .nb-masthead-inner {
            max-width: 860px;
            margin: 0 auto;
            padding: 16px 14px 13px;
            display: flex;
            align-items: center;
            gap: 24px;
            flex-wrap: wrap;
        }

        .nb-wordmark {
            display: flex;
            align-items: center;
            gap: 8px;
            line-height: 1;
            color: var(--masthead-ink);
            font-weight: 700;
            font-size: 1.12rem;
            letter-spacing: 0.01em;
            flex-shrink: 0;
        }

        .nb-tabs { display: flex; align-items: center; gap: 18px; }

        .nb-tab {
            background: none;
            border: none;
            padding: 2px 0 7px;
            line-height: 1;
            font-size: 0.88rem;
            font-weight: 700;
            color: #8290a0;
            border-bottom: 2px solid transparent;
            cursor: pointer;
            font-family: inherit;
        }

        .nb-tab.active { color: var(--masthead-ink); border-bottom-color: var(--accent); }

        .nb-gh-link {
            margin-left: auto;
            flex-shrink: 0;
            color: #8290a0;
            font-size: 0.74rem;
            font-weight: 600;
            text-decoration: none;
            border-bottom: 1px solid transparent;
        }

        .nb-gh-link:hover { color: var(--masthead-ink); border-color: var(--accent); }

        /* ===== 본문 ===== */
        .nb-wrap { max-width: 860px; margin: 0 auto; padding: 0 14px 60px; }

        .nb-hero { padding-top: 22px; }

        .nb-hero-meta {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 6px 18px;
            margin-bottom: 10px;
        }

        .nb-eyebrow {
            font-size: 0.72rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--accent);
            font-weight: 700;
        }

        .nb-hero-utility {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
            font-size: 0.76rem;
            color: var(--ink-soft);
        }

        select.date-select {
            padding: 1px 2px;
            border-radius: 0;
            border: none;
            border-bottom: 1px solid var(--line);
            font-weight: 700;
            font-size: 0.76rem;
            color: var(--ink);
            background-color: transparent;
            cursor: pointer;
            font-family: inherit;
        }

        .btn-tts {
            background: none;
            border: none;
            padding: 0;
            font-size: 0.76rem;
            font-weight: 700;
            color: var(--ink-soft);
            text-decoration: underline;
            text-underline-offset: 3px;
            cursor: pointer;
            font-family: inherit;
        }

        .btn-tts:hover { color: var(--accent); }

        .nb-headline {
            font-family: 'Gowun Batang', 'Noto Serif KR', serif;
            font-size: 1.5rem;
            line-height: 1.42;
            font-weight: 700;
            margin: 0 0 22px;
            max-width: 720px;
        }

        @media (min-width: 760px) {
            .nb-headline { font-size: 2rem; }
        }

        /* 오디오 플레이어 */
        .audio-box {
            border-top: 1px solid var(--line);
            border-bottom: 1px solid var(--line);
            padding: 14px 0;
            margin: 22px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .audio-title {
            font-weight: 700;
            font-size: 0.8rem;
            color: var(--ink-soft);
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        audio { height: 34px; }

        /* 언론사 필터 */
        .press-filter-box {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            margin: 12px 0 20px;
            padding-bottom: 2px;
        }

        .press-filter-box::-webkit-scrollbar { display: none; }

        .filter-btn {
            flex-shrink: 0;
            background: transparent;
            border: 1px solid var(--line);
            padding: 5px 13px;
            border-radius: 0;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.01em;
            color: var(--ink-soft);
            cursor: pointer;
            white-space: nowrap;
            font-family: inherit;
        }

        .filter-btn:hover { border-color: var(--ink); color: var(--ink); }

        .filter-btn.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }

        .article-search-input {
            -webkit-appearance: none;
            appearance: none;
            border: none;
            border-bottom: 1px solid var(--line);
            border-radius: 0;
            padding: 5px 2px;
            font-family: inherit;
            font-size: 0.82rem;
            color: var(--ink);
            background: transparent;
            outline: none;
            width: 140px;
            min-width: 0;
            flex-shrink: 1;
        }

        .article-search-input:focus { border-color: var(--accent); }
        .article-search-input::placeholder { color: var(--ink-soft); }

        /* 섹션 라벨 */
        .nb-section-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--ink-soft);
            border-bottom: 1px solid var(--ink);
            padding-bottom: 8px;
            margin-top: 30px;
        }

        .category-group { margin-bottom: 30px; }

        .category-header {
            font-size: 0.95rem;
            font-weight: 800;
            margin-bottom: 6px;
            padding-bottom: 6px;
            color: var(--ink);
            border-bottom: 1px solid var(--line);
        }

        .notice-box { border-left: 2px solid var(--line); padding: 8px 16px; margin-top: 8px; }

        .notice-title {
            font-weight: 700;
            color: var(--ink-soft);
            margin-bottom: 4px;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }
        .notice-text { color: var(--ink-soft); font-size: 0.92rem; font-weight: 500; font-style: italic; }

        .article-list { display: flex; flex-direction: column; gap: 0; margin-top: 4px; }

        @media (min-width: 760px) {
            .article-list {
                display: block;
                columns: 2;
                column-gap: 40px;
                column-rule: 1px solid var(--line);
            }
            .article-card { break-inside: avoid; }
        }

        .article-card.article-collapsed { display: none; }
        .article-list.expanded .article-card.article-collapsed { display: block; }

        .more-btn {
            margin-top: 10px;
            background: none;
            border: none;
            color: var(--ink);
            padding: 4px 0;
            font-size: 0.82rem;
            font-weight: 700;
            text-decoration: underline;
            text-underline-offset: 3px;
            cursor: pointer;
            font-family: inherit;
        }

        .more-btn:hover { color: var(--accent); }

        .article-card {
            border-bottom: 1px solid var(--line);
            padding: 14px 2px;
        }

        .article-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            color: var(--ink-soft);
            margin-bottom: 6px;
        }

        .press-tag { display: inline-flex; align-items: center; line-height: 0; }

        .press-name-badge {
            display: inline-block;
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.01em;
            color: var(--ink-soft);
            border: 1px solid var(--line);
            padding: 0px 4px;
        }

        .pub-time { color: var(--ink-soft); }

        .article-link {
            display: block;
            text-decoration: none;
            color: var(--ink);
            font-weight: 700;
            font-size: 0.96rem;
            line-height: 1.5;
            cursor: pointer;
        }

        .article-link:hover { color: var(--accent); text-decoration: underline; }
        .article-link.is-read { color: var(--ink-soft); font-weight: 600; }

        .loading-container { text-align: center; padding: 30px; font-weight: 600; color: var(--ink-soft); }

        /* ===== AI 리포트 ===== */
        .summary-section { margin-bottom: 22px; }
        .summary-section:last-child { margin-bottom: 0; }

        .summary-section-title {
            font-size: 0.76rem;
            font-weight: 800;
            color: var(--ink-soft);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        /* TOP3 */
        .top3-grid {
            display: flex;
            flex-direction: column;
            border-top: 1px solid var(--ink);
            border-bottom: 1px solid var(--line);
            margin-bottom: 22px;
        }

        .top3-card { padding: 16px 0; border-top: 1px solid var(--line); cursor: default; }
        .top3-card:first-child { border-top: none; }

        .top3-head { display: flex; align-items: baseline; gap: 7px; flex-wrap: wrap; margin-bottom: 7px; }

        .top3-rank { font-family: 'Gowun Batang', serif; font-size: 0.95rem; font-weight: 700; color: var(--ink); }
        .top3-dot { font-size: 0.68rem; color: var(--ink-soft); }
        .top3-logo { height: 13px; width: auto; vertical-align: middle; }
        .top3-logo.herald { height: 9px; }

        .top3-title { font-weight: 700; font-size: 0.98rem; color: var(--ink); line-height: 1.5; margin-bottom: 4px; }
        .top3-desc { font-size: 0.85rem; color: var(--ink-soft); line-height: 1.55; }

        @media (min-width: 760px) {
            .top3-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
            .top3-card { border-top: none; border-left: 1px solid var(--line); padding: 18px 22px; }
            .top3-card:first-child { border-left: none; padding-left: 0; }
            .top3-rank { font-size: 1.1rem; }
            .top3-logo { height: 15px; }
            .top3-logo.herald { height: 11px; }
            .top3-title { font-size: 1.02rem; }
        }

        /* 언론사 시각 비교 */
        .perspective-box {
            border-left: 2px solid var(--accent);
            padding: 2px 0 2px 16px;
            font-size: 0.9rem;
            font-style: italic;
            color: var(--ink-soft);
            line-height: 1.6;
        }

        /* 분야별 브리핑 */
        .category-grid { display: flex; flex-direction: column; gap: 0; }

        .category-chip {
            display: flex;
            align-items: baseline;
            gap: 10px;
            border-bottom: 1px solid var(--line);
            padding: 10px 0;
        }

        .category-chip-label {
            flex-shrink: 0;
            min-width: 52px;
            font-size: 0.72rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            color: var(--accent);
        }

        .category-chip-text { font-size: 0.88rem; color: var(--ink); line-height: 1.4; }

        /* 언론사별 한눈에 보기 */
        .press-summary-grid { display: flex; flex-direction: column; gap: 0; }

        .press-summary-card {
            display: flex;
            align-items: baseline;
            gap: 10px;
            border-bottom: 1px solid var(--line);
            padding: 10px 0;
        }

        .press-summary-name { flex-shrink: 0; min-width: 74px; font-size: 0.8rem; font-weight: 800; color: var(--ink); }
        .press-summary-text { font-size: 0.88rem; color: var(--ink-soft); line-height: 1.4; }

        /* 출근길 인사이트 */
        .insight-list { list-style: none; display: flex; flex-direction: column; gap: 0; }

        .insight-list li {
            position: relative;
            border-bottom: 1px solid var(--line);
            padding: 10px 0 10px 18px;
            font-size: 0.9rem;
            color: var(--ink);
            line-height: 1.45;
        }

        .insight-list li::before { content: "\2014"; position: absolute; left: 0; color: var(--accent); }

        /* ===== 상세 다이얼로그 ===== */
        .article-modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(16, 20, 25, 0.55);
            z-index: 100;
            padding: 20px;
            align-items: center;
            justify-content: center;
        }

        .article-modal-overlay.open { display: flex; }

        .article-modal {
            background: var(--paper);
            border: 1px solid var(--ink);
            max-width: 520px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            padding: 26px 24px;
            position: relative;
        }

        .article-modal-close {
            position: absolute;
            top: 14px;
            right: 14px;
            background: none;
            border: none;
            font-size: 1.3rem;
            line-height: 1;
            color: var(--ink-soft);
            cursor: pointer;
        }

        .article-modal-close:hover { color: var(--ink); }

        .article-modal-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.74rem;
            font-weight: 700;
            color: var(--ink-soft);
            margin-bottom: 14px;
        }

        .article-modal-title {
            font-family: 'HangyeolBody', -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
            font-size: 1.12rem;
            font-weight: 400;
            line-height: 1.55;
            margin-bottom: 14px;
            padding-right: 24px;
        }

        .article-modal-desc {
            font-family: 'HangyeolBody', -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
            font-size: 0.92rem;
            color: var(--ink-soft);
            line-height: 1.75;
            white-space: pre-line;
            margin-bottom: 18px;
        }

        .article-modal-link {
            display: inline-block;
            font-size: 0.88rem;
            color: var(--accent);
            text-decoration: none;
            border-bottom: 1px solid var(--accent);
        }
    </style>
</head>
<body>

<div class="nb-masthead">
    <div class="nb-masthead-inner">
        <div class="nb-wordmark">
            <svg width="21" height="21" viewBox="0 0 24 24" fill="none" style="flex-shrink: 0;">
                <circle cx="12" cy="12" r="11" stroke="#f3ede0" stroke-width="1.4"/>
                <path d="M7 12.5L10.2 15.7L17 8.5" stroke="#1f7a68" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>뉴스톺아보기</span>
        </div>
        <div class="nb-tabs" id="edition-toggle">
            <button class="nb-tab active" onclick="switchEdition('morning', this)">조간</button>
            <button class="nb-tab" onclick="switchEdition('evening', this)">석간</button>
            <button class="nb-tab" onclick="switchEdition('editorial', this)">사설</button>
        </div>
        <a href="https://github.com/teu-hr/newsbriefing/actions" target="_blank" class="nb-gh-link">GitHub Actions</a>
    </div>
</div>

<div class="nb-wrap">
    <div class="nb-hero">
        <div class="nb-hero-meta">
            <span class="nb-eyebrow" id="summary-card-title">AI 출근 나침반</span>
            <div class="nb-hero-utility">
                <span>날짜 <select id="date-select" class="date-select" onchange="onDateChange()"><option>로딩 중...</option></select></span>
                <span>수집 시각 <span id="update-time">로딩 중...</span></span>
                <button class="btn-tts" onclick="speakSummary()">음성으로 듣기</button>
            </div>
        </div>
        <h1 class="nb-headline" id="hero-headline">오늘 아침, 놓치면 안 되는 이야기</h1>
    </div>

    <div id="ai-summary" class="summary-content">
        <div class="loading-container">최신 AI 리포트를 불러오고 있습니다...</div>
    </div>

    <div id="audio-container" class="audio-box" style="display: none;">
        <div class="audio-title" id="audio-card-title">출근길 오디오 팟캐스트 (AI 생성)</div>
        <audio id="audio-player" controls preload="metadata"></audio>
    </div>

    <div class="nb-section-label">
        <span id="articles-card-title">언론사 원문 기사 목록</span>
        <input type="search" id="article-search-input" class="article-search-input" placeholder="제목 검색" oninput="onArticleSearchInput()">
    </div>

    <div class="press-filter-box nb-hscroll" id="press-filter"></div>

    <div id="articles-container">
        <div class="loading-container">기사 목록을 불러오는 중입니다...</div>
    </div>
</div>

<div class="article-modal-overlay" id="article-modal-overlay">
    <div class="article-modal">
        <button class="article-modal-close" id="article-modal-close" aria-label="닫기">&times;</button>
        <div class="article-modal-meta">
            <span id="article-modal-press"></span>
            <span id="article-modal-time"></span>
        </div>
        <div class="article-modal-title" id="article-modal-title"></div>
        <div class="article-modal-desc" id="article-modal-desc"></div>
        <a class="article-modal-link" id="article-modal-link" href="#" target="_blank" rel="noopener">원문 기사 보기 →</a>
    </div>
</div>

<script>
    let globalData = null;
    let selectedPress = "ALL";
    let searchQuery = "";
    let currentEdition = "morning"; // "morning"(조간) | "evening"(석간) | "editorial"(사설)
    const ARTICLES_COLLAPSE_COUNT = 5; // 카테고리별 원문 목록 기본 노출 개수 (나머지는 "더보기")

    // TOP3에서만 언론사 CI 로고를 보여준다(제공받은 실물 로고가 있는 9개사).
    // 나머지 지면에서는 여전히 텍스트 배지를 쓴다 — 실물 자료가 없는 언론사를 추측해서 그리지 않기 위함.
    const TOP3_LOGO_MAP = {
        '동아일보': 'donga-ci.png', '조선일보': 'chosun-ci.png', '중앙일보': 'joongang-ci.png',
        '한겨레': 'hani-ci.png', '경향신문': 'khan-ci.png', '한국경제': 'hankyung-ci.png',
        '매일경제': 'mk-ci.png', '문화일보': 'munhwa-ci.png', '헤럴드경제': 'herald-ci.png'
    };

    // 판(조간/석간/사설)마다 다른 언론사·카테고리·문구를 한곳에 모아둔 설정.
    // suffix는 history/index 파일명과 data.json 하위 키 이름에 그대로 쓰인다.
    const EDITION_META = {
        morning: {
            suffix: '', dataKey: null,
            press: ["동아일보", "조선일보", "중앙일보", "한겨레", "경향신문", "한국경제", "매일경제"],
            categories: ["정치", "경제", "사회", "국제", "사설"],
            articlesTitle: '조간 7대 언론사',
            compassTitle: 'AI 출근 나침반',
            heroHeadline: '오늘 아침, 놓치면 안 되는 이야기',
            audioTitle: '출근길 오디오 팟캐스트 (AI 생성)',
            insightsTitle: '출근길 인사이트'
        },
        evening: {
            suffix: '_evening', dataKey: 'evening',
            press: ["문화일보", "헤럴드경제"],
            categories: ["정치", "경제", "사회", "국제", "사설"],
            articlesTitle: '석간(문화일보·헤럴드경제)',
            compassTitle: 'AI 퇴근 나침반',
            heroHeadline: '퇴근길에 챙기는 오늘의 마무리',
            audioTitle: '퇴근길 오디오 팟캐스트 (AI 생성)',
            insightsTitle: '퇴근길 인사이트'
        },
        editorial: {
            suffix: '_editorial', dataKey: 'editorial',
            press: ["동아일보", "조선일보", "중앙일보", "한겨레", "경향신문"],
            categories: ["사설"],
            articlesTitle: '사설 비교 (5대 언론사)',
            compassTitle: 'AI 사설 비교',
            heroHeadline: '오늘 사설, 신문사마다 다르게 읽었습니다',
            audioTitle: '오늘의 사설 브리핑 (AI 생성)',
            insightsTitle: '오늘의 논조 인사이트'
        }
    };

    async function initDashboard() {
        await loadIndexDates(currentEdition);
        await loadData();
    }

    // 조간/석간/사설 판을 바꾸면 해당 판의 날짜 목록과 최신 데이터를 다시 불러온다.
    function switchEdition(edition, btn) {
        if (currentEdition === edition) return;
        currentEdition = edition;
        document.querySelectorAll('#edition-toggle .nb-tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        loadIndexDates(edition);
        loadData();
    }

    // 현재 선택된 판에 맞는 리포트 데이터를 globalData에서 꺼낸다.
    // data.json 루트는 {morning, realtime, evening, editorial} 형태이고, history/*.json
    // 개별 파일은 이미 해당 판의 리포트만 담은 평면 구조라 dataKey가 없으면 그대로 쓴다.
    function getPayload() {
        if (!globalData) return null;
        const meta = EDITION_META[currentEdition];
        if (meta.dataKey) return globalData[meta.dataKey] || globalData;
        return globalData.realtime || globalData.morning || globalData;
    }

    async function loadIndexDates(edition) {
        const timestamp = Date.now();
        const idxName = `index${EDITION_META[edition].suffix}.json`;
        const indexUrl = `history/${idxName}?t=${timestamp}`;
        try {
            const res = await fetch(indexUrl);
            if (res.ok) {
                const dates = await res.json();
                const select = document.getElementById('date-select');
                select.innerHTML = '';
                dates.forEach(d => {
                    const opt = document.createElement('option');
                    opt.value = d;
                    opt.innerText = d;
                    select.appendChild(opt);
                });
            }
        } catch (e) {}
    }

    async function loadData(targetDate = null) {
        const timestamp = Date.now();
        const suffix = EDITION_META[currentEdition].suffix;
        // 같은 오리진의 상대경로를 먼저 시도(GitHub Pages CDN 캐시라 더 빠르고 안정적),
        // 실패할 때만 raw.githubusercontent.com으로 폴백한다.
        let fetchUrl = `data.json?t=${timestamp}`;

        if (targetDate) {
            fetchUrl = `history/${targetDate}${suffix}.json?t=${timestamp}`;
        }

        try {
            let res = await fetch(fetchUrl);
            if (!res.ok) res = await fetch(`https://raw.githubusercontent.com/teu-hr/newsbriefing/main/data.json?t=${timestamp}`);

            if (res.ok) {
                globalData = await res.json();
                renderDashboard();
            } else {
                showError();
            }
        } catch (e) {
            showError();
        }
    }

    function onDateChange() {
        const date = document.getElementById('date-select').value;
        loadData(date);
    }

    // 파비콘은 너무 작고 제네릭해서 언론사 구분이 안 돼, 언론사명 텍스트 배지로 표시한다.
    function pressTagHtml(pressName) {
        const name = pressName || '언론사';
        return `<span class="press-tag press-name-badge">${escapeHtml(name)}</span>`;
    }

    // TOP3에서만: 실물 로고가 있으면 이미지, 없으면 텍스트 배지로 폴백.
    function top3PressHtml(pressName) {
        const file = TOP3_LOGO_MAP[pressName];
        if (!file) return pressTagHtml(pressName);
        const cls = pressName === '헤럴드경제' ? 'top3-logo herald' : 'top3-logo';
        return `<img class="${cls}" src="assets/press-logos/${file}" alt="${escapeHtml(pressName)}">`;
    }

    function renderPressFilter() {
        const meta = EDITION_META[currentEdition];
        const box = document.getElementById('press-filter');
        box.innerHTML = '';
        const allBtn = document.createElement('button');
        allBtn.className = 'filter-btn active';
        allBtn.innerText = '전체';
        allBtn.onclick = () => filterPress('ALL', allBtn);
        box.appendChild(allBtn);
        meta.press.forEach(name => {
            const btn = document.createElement('button');
            btn.className = 'filter-btn';
            btn.innerText = name;
            btn.onclick = () => filterPress(name, btn);
            box.appendChild(btn);
        });
        selectedPress = 'ALL';

        document.getElementById('articles-card-title').innerText = `${meta.articlesTitle} 원문 기사 목록`;
        document.getElementById('summary-card-title').innerText = meta.compassTitle;
        document.getElementById('hero-headline').innerText = meta.heroHeadline;
        document.getElementById('audio-card-title').innerText = meta.audioTitle;
    }

    function renderDashboard() {
        if (!globalData) return;
        const payload = getPayload();
        renderPressFilter();

        document.getElementById('update-time').innerText = payload.updated_at || '-';

        // 오디오 처리
        const audioContainer = document.getElementById('audio-container');
        const audioPlayer = document.getElementById('audio-player');

        if (payload.has_audio || payload.audio_url) {
            const audioSrc = `${payload.audio_url || 'latest.mp3'}?t=${Date.now()}`;
            audioPlayer.src = audioSrc;
            audioContainer.style.display = 'flex';
        } else {
            audioContainer.style.display = 'none';
        }

        // 요약 처리
        const summaryElem = document.getElementById('ai-summary');
        if (payload.summary) {
            const sections = parseSummarySections(payload.summary);
            if (sections) {
                summaryElem.innerHTML = renderStructuredSummary(sections);
            } else {
                // 예전 포맷(마커 없음) 데이터를 위한 하위 호환 렌더링
                let formattedSummary = payload.summary
                    .replace(/^# (.*$)/gim, '<h2 style="font-size:1.15rem; font-weight:800; margin-top:18px; margin-bottom:8px; color:var(--ink);">$1</h2>')
                    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                    .replace(/\n/g, '<br>');
                summaryElem.innerHTML = formattedSummary;
            }
        } else {
            summaryElem.innerHTML = '생성된 요약 리포트가 없습니다.';
        }

        renderArticles();
    }

    // ===== AI 리포트 파싱 & 카드형 렌더링 =====
    const SUMMARY_MARKERS = ["TOP3", "PERSPECTIVES", "CATEGORY_REPORT", "PRESS_SUMMARY", "INSIGHTS"];

    function parseSummarySections(raw) {
        const markerLine = /^#\s*(TOP3|PERSPECTIVES|CATEGORY_REPORT|PRESS_SUMMARY|INSIGHTS)\s*$/;
        if (!raw.split('\n').some(l => markerLine.test(l.trim()))) return null;

        const sections = {};
        let current = null;
        let buffer = [];

        raw.split('\n').forEach(line => {
            const m = line.trim().match(markerLine);
            if (m) {
                if (current) sections[current] = buffer.join('\n').trim();
                current = m[1];
                buffer = [];
            } else if (current) {
                buffer.push(line);
            }
        });
        if (current) sections[current] = buffer.join('\n').trim();
        return sections;
    }

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.innerText = str;
        return div.innerHTML;
    }

    function renderTop3(text) {
        const items = [];
        const lines = text.split('\n');
        for (let i = 0; i < lines.length; i++) {
            const m = lines[i].match(/^###\s*(\d+)\.\s*\[([^\]]+)\]\s*(.+)$/);
            if (m) {
                let desc = '';
                const next = lines[i + 1] || '';
                const dm = next.match(/^-\s*요약:\s*(.+)$/);
                if (dm) desc = dm[1].trim();
                items.push({ rank: m[1], press: m[2].trim(), title: m[3].trim(), desc });
            }
        }
        if (items.length === 0) return `<div class="notice-text">표시할 TOP3 데이터가 없습니다.</div>`;
        return `<div class="top3-grid">` + items.map(it => `
            <div class="top3-card">
                <div class="top3-head">
                    <span class="top3-rank">${escapeHtml(it.rank)}</span>
                    <span class="top3-dot">·</span>
                    ${top3PressHtml(it.press)}
                </div>
                <div class="top3-title">${escapeHtml(it.title)}</div>
                ${it.desc ? `<div class="top3-desc">${escapeHtml(it.desc)}</div>` : ''}
            </div>
        `).join('') + `</div>`;
    }

    function renderPerspectives(text) {
        if (!text) return '';
        return `<div class="perspective-box">${escapeHtml(text).replace(/\n/g, '<br>')}</div>`;
    }

    function renderCategoryReport(text) {
        const rows = text.split('\n').map(l => l.trim()).filter(l => l.startsWith('-'));
        if (rows.length === 0) return '';
        return `<div class="category-grid">` + rows.map(row => {
            const m = row.match(/^-\s*([^:]+):\s*(.+)$/);
            if (!m) return '';
            return `<div class="category-chip"><span class="category-chip-label">${escapeHtml(m[1].trim())}</span><span class="category-chip-text">${escapeHtml(m[2].trim())}</span></div>`;
        }).join('') + `</div>`;
    }

    function renderPressSummary(text) {
        const rows = text.split('\n').map(l => l.trim()).filter(l => l.startsWith('-'));
        if (rows.length === 0) return '';
        return `<div class="press-summary-grid">` + rows.map(row => {
            const m = row.match(/^-\s*([^:]+):\s*(.+)$/);
            if (!m) return '';
            return `<div class="press-summary-card"><span class="press-summary-name">${escapeHtml(m[1].trim())}</span><span class="press-summary-text">${escapeHtml(m[2].trim())}</span></div>`;
        }).join('') + `</div>`;
    }

    function renderInsights(text) {
        const rows = text.split('\n').map(l => l.trim()).filter(l => /^\d+\./.test(l));
        if (rows.length === 0) return '';
        return `<ul class="insight-list">` + rows.map(row => {
            const m = row.match(/^\d+\.\s*(.+)$/);
            return `<li>${escapeHtml(m ? m[1].trim() : row)}</li>`;
        }).join('') + `</ul>`;
    }

    function renderStructuredSummary(sections) {
        let html = '';
        if (sections.TOP3) {
            html += `<div class="summary-section">${renderTop3(sections.TOP3)}</div>`;
        }
        if (sections.PERSPECTIVES) {
            html += `<div class="summary-section"><div class="summary-section-title">언론사 시각 비교</div>${renderPerspectives(sections.PERSPECTIVES)}</div>`;
        }
        if (sections.CATEGORY_REPORT) {
            html += `<div class="summary-section"><div class="summary-section-title">분야별 브리핑</div>${renderCategoryReport(sections.CATEGORY_REPORT)}</div>`;
        }
        if (sections.PRESS_SUMMARY) {
            html += `<div class="summary-section"><div class="summary-section-title">언론사별 한눈에 보기</div>${renderPressSummary(sections.PRESS_SUMMARY)}</div>`;
        }
        if (sections.INSIGHTS) {
            html += `<div class="summary-section"><div class="summary-section-title">${EDITION_META[currentEdition].insightsTitle}</div>${renderInsights(sections.INSIGHTS)}</div>`;
        }
        return html || '<div class="notice-text">표시할 리포트 내용이 없습니다.</div>';
    }

    function filterPress(press, btn) {
        selectedPress = press;
        document.querySelectorAll('#press-filter .filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderArticles();
    }

    function onArticleSearchInput() {
        searchQuery = document.getElementById('article-search-input').value.trim().toLowerCase();
        renderArticles();
    }

    // 읽은 기사 표시: 브라우저에만 저장(서버 전송 없음). 무한정 쌓이지 않게 최근
    // READ_LINKS_LIMIT개만 유지한다.
    const READ_LINKS_KEY = 'nb_read_links';
    const READ_LINKS_LIMIT = 500;

    function getReadLinks() {
        try {
            return new Set(JSON.parse(localStorage.getItem(READ_LINKS_KEY) || '[]'));
        } catch (e) {
            return new Set();
        }
    }

    function markLinkAsRead(link) {
        try {
            const arr = JSON.parse(localStorage.getItem(READ_LINKS_KEY) || '[]');
            if (arr.includes(link)) return;
            arr.push(link);
            while (arr.length > READ_LINKS_LIMIT) arr.shift();
            localStorage.setItem(READ_LINKS_KEY, JSON.stringify(arr));
        } catch (e) {
            // 프라이빗 브라우징 등으로 localStorage를 못 쓰면 읽음 표시만 조용히 건너뜀
        }
    }

    function renderArticles() {
        if (!globalData) return;
        const payload = getPayload();
        const container = document.getElementById('articles-container');
        container.innerHTML = '';

        const categories = payload.categories || {};
        const categoryKeys = EDITION_META[currentEdition].categories;
        const readLinks = getReadLinks();

        categoryKeys.forEach(cat => {
            let articles = categories[cat] || [];

            if (selectedPress !== "ALL") {
                articles = articles.filter(a => a.press_name === selectedPress);
            }
            if (searchQuery) {
                articles = articles.filter(a => (a.title || '').toLowerCase().includes(searchQuery));
            }

            const group = document.createElement('div');
            group.className = 'category-group';

            const catTitle = document.createElement('div');
            catTitle.className = 'category-header';
            catTitle.innerText = cat;
            group.appendChild(catTitle);

            if (articles.length === 0) {
                const noticeBox = document.createElement('div');
                noticeBox.className = 'notice-box';
                noticeBox.innerHTML = `
                    <div class="notice-title">안내</div>
                    <div class="notice-text">선택 조건에 해당하는 ${cat} 기사가 없습니다.</div>
                `;
                group.appendChild(noticeBox);
            } else {
                const list = document.createElement('div');
                list.className = 'article-list';

                let visibleIdx = 0;
                articles.forEach(art => {
                    if (art.link === '#' || art.press_name === '안내') return;

                    const item = document.createElement('div');
                    item.className = 'article-card';
                    if (visibleIdx >= ARTICLES_COLLAPSE_COUNT) item.classList.add('article-collapsed');
                    visibleIdx++;
                    const isRead = readLinks.has(art.link);
                    item.innerHTML = `
                        <div class="article-meta">
                            ${pressTagHtml(art.press_name)}
                            <span class="pub-time">${art.pub_time || ''}</span>
                        </div>
                        <span class="article-link${isRead ? ' is-read' : ''}" role="button" tabindex="0">${art.title}</span>
                    `;
                    const titleEl = item.querySelector('.article-link');
                    const onOpen = () => {
                        markLinkAsRead(art.link);
                        titleEl.classList.add('is-read');
                        openArticleModal(art);
                    };
                    titleEl.addEventListener('click', onOpen);
                    titleEl.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onOpen(); }
                    });
                    list.appendChild(item);
                });

                if (list.children.length === 0) {
                    const noticeBox = document.createElement('div');
                    noticeBox.className = 'notice-box';
                    noticeBox.innerHTML = `<div class="notice-text">출고된 기사가 없습니다.</div>`;
                    group.appendChild(noticeBox);
                } else {
                    group.appendChild(list);

                    const hiddenCount = list.querySelectorAll('.article-collapsed').length;
                    if (hiddenCount > 0) {
                        const moreBtn = document.createElement('button');
                        moreBtn.className = 'more-btn';
                        moreBtn.innerText = `더보기 (${hiddenCount}건 더)`;
                        moreBtn.onclick = () => {
                            const expanded = list.classList.toggle('expanded');
                            moreBtn.innerText = expanded ? '접기' : `더보기 (${hiddenCount}건 더)`;
                        };
                        group.appendChild(moreBtn);
                    }
                }
            }

            container.appendChild(group);
        });
    }

    function openArticleModal(art) {
        document.getElementById('article-modal-press').innerHTML = pressTagHtml(art.press_name);
        document.getElementById('article-modal-time').innerText = art.pub_time || '';
        document.getElementById('article-modal-title').innerText = art.title;
        document.getElementById('article-modal-desc').innerText = art.description || '요약이 제공되지 않은 기사입니다.';
        document.getElementById('article-modal-link').href = art.link;
        document.getElementById('article-modal-overlay').classList.add('open');
    }

    function closeArticleModal() {
        document.getElementById('article-modal-overlay').classList.remove('open');
    }

    document.getElementById('article-modal-close').addEventListener('click', closeArticleModal);
    document.getElementById('article-modal-overlay').addEventListener('click', (e) => {
        if (e.target.id === 'article-modal-overlay') closeArticleModal();
    });
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeArticleModal();
    });

    function speakSummary() {
        if (!globalData) return;
        const payload = getPayload();
        if (!payload.summary) return;

        window.speechSynthesis.cancel();
        // 섹션 마커(# TOP3 등)와 마크다운 기호를 제거하고 자연스럽게 이어 읽기
        const cleanText = payload.summary
            .split('\n')
            .filter(l => !l.trim().startsWith('#'))
            .join(' ')
            .replace(/###\s*\d+\.\s*/g, '')
            .replace(/-\s*요약:\s*/g, '')
            .replace(/[\*`_~\[\]]/g, '');
        const utterance = new SpeechSynthesisUtterance(cleanText);
        utterance.lang = 'ko-KR';
        utterance.rate = 1.0;
        window.speechSynthesis.speak(utterance);
    }

    function showError() {
        document.getElementById('ai-summary').innerText = '데이터를 불러오지 못했습니다.';
        document.getElementById('articles-container').innerText = '데이터를 불러오지 못했습니다.';
    }

    window.addEventListener('DOMContentLoaded', initDashboard);
</script>
