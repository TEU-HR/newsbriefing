<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사설 필사 — 뉴스톺아보기</title>
    <link rel="icon" type="image/png" href="assets/logo/favicon-32.png">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap">
    <style>
        @font-face {
            font-family: 'HangyeolBody';
            src: url('assets/fonts/HangyeolBody.woff2') format('woff2');
            font-weight: 400;
            font-display: swap;
        }

        :root {
            --paper: #f7f4ee;
            --ink: #172230;
            --ink-soft: #6c7480;
            --line: #e2ddd0;
            --masthead: #101c2b;
            --masthead-ink: #f3ede0;
            --accent: #1f7a68;
            --error: #b6473f;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --paper: #13181f;
                --ink: #eef1f5;
                --ink-soft: #8b93a0;
                --line: #2a3340;
                --accent: #35a98c;
                --error: #d97a72;
            }
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--paper);
            color: var(--ink);
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
        }

        .masthead {
            background: var(--masthead);
            color: var(--masthead-ink);
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .masthead a { color: var(--masthead-ink); text-decoration: none; font-weight: 700; }
        .masthead .back { font-size: 0.85rem; opacity: 0.85; }

        .pilsa-wrap { max-width: 1200px; margin: 0 auto; padding: 24px; }

        .pilsa-meta { margin-bottom: 18px; }
        .pilsa-press { font-size: 0.78rem; font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: 0.06em; }
        .pilsa-title {
            font-family: 'HangyeolBody', -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
            font-size: 1.4rem;
            margin: 6px 0 0;
        }

        .pilsa-done-badge {
            display: inline-block;
            margin-top: 10px;
            padding: 4px 10px;
            border: 1px solid var(--accent);
            border-radius: 999px;
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--accent);
        }

        .pilsa-stats {
            display: flex;
            gap: 20px;
            margin: 16px 0 20px;
            font-size: 0.85rem;
            color: var(--ink-soft);
            flex-wrap: wrap;
        }
        .pilsa-stats b { color: var(--ink); font-variant-numeric: tabular-nums; }

        .pilsa-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            align-items: start;
        }

        .pilsa-pane {
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 20px;
            height: 70vh;
            overflow-y: auto;
        }

        .pilsa-pane h2 {
            font-size: 0.76rem;
            font-weight: 800;
            color: var(--ink-soft);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin: 0 0 14px;
        }

        #source-text {
            font-family: 'HangyeolBody', -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
            font-size: 1rem;
            line-height: 1.9;
            white-space: pre-wrap;
        }

        .ch-correct { color: var(--accent); }
        .ch-error { color: #fff; background: var(--error); border-radius: 2px; }
        .ch-pending { color: var(--ink-soft); }

        #typing-input {
            width: 100%;
            height: calc(70vh - 60px);
            border: none;
            outline: none;
            resize: none;
            background: transparent;
            color: var(--ink);
            font-family: 'HangyeolBody', -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
            font-size: 1rem;
            line-height: 1.9;
        }

        .pilsa-done {
            margin-top: 16px;
            padding: 14px 16px;
            border: 1px solid var(--accent);
            border-radius: 8px;
            color: var(--accent);
            font-weight: 700;
        }

        .pilsa-unsupported {
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 40px 24px;
            text-align: center;
            color: var(--ink-soft);
        }
        .pilsa-unsupported a { color: var(--accent); }

        .mobile-block { display: none; }

        @media (max-width: 860px) {
            .pilsa-columns { display: none; }
            .mobile-block {
                display: block;
                border: 1px solid var(--line);
                border-radius: 8px;
                padding: 40px 24px;
                text-align: center;
                color: var(--ink-soft);
            }
        }
    </style>
</head>
<body>
    <div class="masthead">
        <a href="index.html">뉴스톺아보기</a>
        <a class="back" href="index.html">← 목록으로</a>
    </div>

    <div class="pilsa-wrap">
        <div class="pilsa-meta">
            <div class="pilsa-press" id="pilsa-press">불러오는 중...</div>
            <h1 class="pilsa-title" id="pilsa-title"></h1>
            <div class="pilsa-done-badge" id="pilsa-done-badge" style="display:none;"></div>
        </div>

        <div class="mobile-block">필사 기능은 데스크톱 화면(가로 860px 이상)에서만 사용할 수 있습니다.</div>

        <div id="pilsa-body"></div>
    </div>

    <script>
        function escapeHtml(str) {
            const div = document.createElement('div');
            div.innerText = str;
            return div.innerHTML;
        }

        function qs(name) {
            return new URLSearchParams(location.search).get(name);
        }

        // 신문 사설 원문에는 스마트 따옴표(‘’“”)·가운뎃점(·)·줄표(–—)·말줄임표(…)처럼
        // 일반 키보드로 똑같이 칠 수 없는 문자가 자주 나온다. 그대로 정답 판정을 하면
        // 그 글자에서 영원히 오답으로 멈춰버리므로, 비교할 때만 키보드로 칠 수 있는
        // 문자와 같은 것으로 인정한다(화면에 보이는 원문 글자 자체는 그대로 둔다).
        const CHAR_EQUIV = {
            '‘': "'", '’': "'", '‚': "'",
            '“': '"', '”': '"', '„': '"',
            '–': '-', '—': '-', '−': '-',
            '·': '.', '•': '.', '‧': '.', '…': '.',
        };
        function normalizeChar(ch) {
            return CHAR_EQUIV[ch] || ch;
        }
        function charsMatch(a, b) {
            return normalizeChar(a) === normalizeChar(b);
        }

        // 문단 사이 "\n\n"은 원문에 보여주기 위한 줄바꿈일 뿐이라, 엔터를 1번만
        // 쳐도(줄바꿈 1개) 다음 문단으로 인정해야 한다. 원문의 개행 두 칸과
        // 타이핑한 개행 한 칸을 1:1로 비교하면, 엔터를 정확히 2번 쳐야만 맞아
        // 들어가서 한 번만 치면 그 뒤가 전부 오답으로 밀리는 문제가 있었다(리포트됨).
        function computeMatch(target, typed) {
            let ti = 0, pi = 0;
            while (ti < target.length && pi < typed.length) {
                if (target[ti] === '\n') {
                    if (typed[pi] !== '\n') break;
                    while (ti < target.length && target[ti] === '\n') ti++;
                    while (pi < typed.length && typed[pi] === '\n') pi++;
                    continue;
                }
                if (!charsMatch(typed[pi], target[ti])) break;
                ti++; pi++;
            }
            return { targetIndex: ti, typedIndex: pi };
        }

        function renderDiff(target, typed) {
            const { targetIndex: i, typedIndex: pi } = computeMatch(target, typed);
            const correct = target.slice(0, i);
            const hasError = pi < typed.length;
            const errorChar = hasError ? target[i] : '';
            const rest = target.slice(i + (hasError ? 1 : 0));
            return `<span class="ch-correct">${escapeHtml(correct)}</span>`
                + (hasError ? `<span class="ch-error">${escapeHtml(errorChar)}</span>` : '')
                + `<span class="ch-pending">${escapeHtml(rest)}</span>`;
        }

        let startTime = null;
        let timerInterval = null;

        function formatElapsed(ms) {
            const s = Math.floor(ms / 1000);
            return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
        }

        // 필사 완료 기록은 기사 링크 기준으로 이 브라우저에만 저장한다(서버 없음).
        function pilsaCompletionKey(link) {
            return `nb-pilsa-done-${link}`;
        }
        function formatCompletionDate(iso) {
            const d = new Date(iso);
            return `${d.getFullYear()}년 ${String(d.getMonth() + 1).padStart(2, '0')}월 ${String(d.getDate()).padStart(2, '0')}일`;
        }
        function showCompletionBadge(iso) {
            const badge = document.getElementById('pilsa-done-badge');
            badge.innerText = `✓ ${formatCompletionDate(iso)} 필사 완료`;
            badge.style.display = 'inline-block';
        }

        function setupPilsa(article) {
            document.getElementById('pilsa-press').innerText = article.press_name || '';
            document.getElementById('pilsa-title').innerText = article.title || '';

            try {
                const saved = localStorage.getItem(pilsaCompletionKey(article.link));
                if (saved) showCompletionBadge(saved);
            } catch (e) { /* localStorage 접근 불가해도 화면 동작에는 지장 없음 */ }

            const target = article.full_text;
            const body = document.getElementById('pilsa-body');

            if (!target) {
                body.innerHTML = `<div class="pilsa-unsupported">
                    이 언론사는 아직 필사 기능을 지원하지 않습니다.<br>
                    ${article.link ? `<a href="${article.link}" target="_blank" rel="noopener">원문 기사에서 직접 확인하세요 →</a>` : ''}
                </div>`;
                return;
            }

            body.innerHTML = `
                <div class="pilsa-stats">
                    <span>진행률 <b id="stat-progress">0%</b></span>
                    <span>정확도 <b id="stat-accuracy">100%</b></span>
                    <span>경과 시간 <b id="stat-time">00:00</b></span>
                </div>
                <div class="pilsa-columns">
                    <div class="pilsa-pane">
                        <h2>원문</h2>
                        <div id="source-text"></div>
                    </div>
                    <div class="pilsa-pane">
                        <h2>여기에 따라 써보세요</h2>
                        <textarea id="typing-input" placeholder="왼쪽 원문을 보면서 타이핑하세요" spellcheck="false"></textarea>
                    </div>
                </div>
                <div class="pilsa-done" id="pilsa-done" style="display:none;"></div>
            `;

            const sourceEl = document.getElementById('source-text');
            const inputEl = document.getElementById('typing-input');
            sourceEl.innerHTML = renderDiff(target, '');

            inputEl.addEventListener('input', () => {
                const typed = inputEl.value;
                if (!startTime && typed.length > 0) {
                    startTime = Date.now();
                    timerInterval = setInterval(() => {
                        document.getElementById('stat-time').innerText = formatElapsed(Date.now() - startTime);
                    }, 1000);
                }

                sourceEl.innerHTML = renderDiff(target, typed);

                const { targetIndex: matched, typedIndex: matchedTyped } = computeMatch(target, typed);

                document.getElementById('stat-progress').innerText = `${Math.round((matched / target.length) * 100)}%`;
                document.getElementById('stat-accuracy').innerText = typed.length
                    ? `${Math.round((matchedTyped / typed.length) * 100)}%` : '100%';

                if (matched >= target.length) {
                    clearInterval(timerInterval);
                    inputEl.disabled = true;
                    const doneEl = document.getElementById('pilsa-done');
                    doneEl.style.display = 'block';
                    doneEl.innerText = `필사 완료! 소요 시간 ${formatElapsed(Date.now() - startTime)}`;

                    const nowIso = new Date().toISOString();
                    try { localStorage.setItem(pilsaCompletionKey(article.link), nowIso); } catch (e) {}
                    showCompletionBadge(nowIso);
                }
            });
        }

        async function init() {
            const link = qs('link');
            try {
                const res = await fetch(`data.json?t=${Date.now()}`);
                const data = await res.json();
                const list = (data.editorial && data.editorial.categories && data.editorial.categories['사설']) || [];
                const article = list.find(a => a.link === link);
                if (!article) {
                    document.getElementById('pilsa-press').innerText = '';
                    document.getElementById('pilsa-title').innerText = '기사를 찾을 수 없습니다.';
                    document.getElementById('pilsa-body').innerHTML =
                        '<div class="pilsa-unsupported">오늘자 사설 목록에서 해당 기사를 찾지 못했습니다. 사설 탭에서 다시 열어주세요.</div>';
                    return;
                }
                setupPilsa(article);
            } catch (e) {
                document.getElementById('pilsa-title').innerText = '데이터를 불러오지 못했습니다.';
            }
        }

        init();
    </script>
</body>
</html>
