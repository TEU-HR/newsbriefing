name: Daily Morning Briefing Collector

on:
  schedule:
    - cron: '0 23 * * *' # UTC 23:00 = 한국 시간(KST) 오전 8:00
  workflow_dispatch:
    inputs:
      run_type:
        description: '실행 모드 선택 (morning: 오늘 08시 이전 기사 수집 / realtime: 실시간 전체 수집)'
        required: true
        default: 'realtime'
        type: choice
        options:
          - realtime
          - morning

jobs:
  run-collector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser google-genai

      - name: Run collector script
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          RUN_TYPE: ${{ github.event.inputs.run_type || (github.event_name == 'schedule' && 'morning' || 'realtime') }}
        run: python collector.py

      - name: Commit and Push updated data.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Update briefing data [skip ci]" || exit 0
          git push
