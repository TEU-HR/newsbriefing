name: Daily AI & Tech News Bot

on:
  # [수정] GitHub Actions의 schedule 트리거는 공식적으로 "best-effort"라 전 세계 큐가
  #        밀리면 1~4시간씩 늦게 시작된다(:50분으로 옮겨도 마찬가지로 확인됨). 반면
  #        workflow_dispatch는 큐를 안 타고 즉시 실행되므로, 외부 스케줄러(cron-job.org 등)가
  #        정확한 시각(조간 07:00 / 석간 17:50 KST)에 이 API를 호출해 대신 트리거한다.
  #        schedule을 같이 켜두면 외부 호출과 겹칠 때 카톡/이메일이 중복 발송되므로 비워둔다.
  workflow_dispatch:
    inputs:
      edition:
        description: '실행할 브리핑 판'
        required: false
        default: 'morning'
        type: choice
        options:
          - morning
          - evening

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install google-genai gtts

      # [수정] schedule 트리거를 없애서 workflow_dispatch만 남았으므로, 입력값을 그대로 쓴다.
      #        외부 스케줄러가 조간/석간마다 edition 입력을 지정해서 호출한다.
      - name: 실행할 판(조간/석간) 결정
        id: edition
        run: echo "value=${{ github.event.inputs.edition || 'morning' }}" >> "$GITHUB_OUTPUT"

      - name: 수집 및 AI 요약 실행
        env:
          EDITION: ${{ steps.edition.outputs.value }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
        run: python main.py

      - name: 변경사항 저장 및 Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "Auto-update news briefing data [skip ci]"
          git push
